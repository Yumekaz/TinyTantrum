[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinytrantrum"
version = "0.1.0"
description = "A reproducible from-scratch character-level transformer laboratory."
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
dashboard = ["gradio>=5.0", "matplotlib>=3.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
